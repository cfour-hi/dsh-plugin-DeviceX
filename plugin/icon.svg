<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Device X">
  <defs>
    <linearGradient id="dx-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6bff"/>
      <stop offset="1" stop-color="#7a4dff"/>
    </linearGradient>
    <linearGradient id="dx-orbit" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#63e6ff"/>
      <stop offset="1" stop-color="#9d7bff"/>
    </linearGradient>
  </defs>

  <!-- device block -->
  <rect x="21" y="11" width="22" height="33" rx="5" fill="url(#dx-body)"/>
  <!-- screen -->
  <rect x="25" y="15" width="14" height="25" rx="2.5" fill="#0b1024"/>
  <!-- gauge ring, opening at the upper right -->
  <circle cx="32" cy="24" r="5.2" fill="none" stroke="#63e6ff" stroke-width="1.25"
          pathLength="100" stroke-dasharray="88 12" transform="rotate(-22 32 24)"/>
  <!-- needle -->
  <path d="M32 24L35.3 20.7" stroke="#63e6ff" stroke-width="1.25" stroke-linecap="round"/>
  <!-- readout bars -->
  <path d="M27.5 30.5h9M27.5 33.5h6.5M27.5 36.5h7.5" stroke="#63e6ff" stroke-width="1.1"
        stroke-linecap="round"/>
  <!-- feet -->
  <path d="M26 44v4M32 44v4M38 44v4" stroke="#c9d6ff" stroke-width="2.2" stroke-linecap="round"/>
  <!-- orbit and satellite -->
  <ellipse cx="32" cy="37" rx="24.5" ry="8.2" fill="none" stroke="url(#dx-orbit)"
           stroke-width="1.15" transform="rotate(-24 32 37)"/>
  <circle cx="54.4" cy="27.0" r="1.9" fill="#63e6ff"/>
</svg>
