name: verify

# Also called by `release.yml` (`uses: ./.github/workflows/verify.yml`) so a
# tagged release can only publish a commit that passed exactly this gate.
on:
  push:
    # Branch pushes only: a tag push is handled by release.yml, which calls this
    # workflow itself — listening to tags here would run the suite twice.
    branches:
      - '**'
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    # macOS is the development target; the Windows half is covered by fixtures
    # and a simulated win32 Host, so one macOS runner is enough.
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build artifact is current
        run: node scripts/build-client.mjs --check
      - name: JSDoc/TypeScript check (host)
        run: npm run typecheck
      - name: Unit tests (node:test parsers/mappers/validators)
        run: npm test
      - name: Build-engine conformance (B esbuild + C concat + D committed artifact)
        run: npm run verify:build
      - name: Client render assertions (jsdom)
        run: node scripts/render-check.mjs
      - name: Offline verification suites
        run: npm run verify
